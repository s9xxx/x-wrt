name: 🛠️ X-Wrt 其他平台（ramips/ath79/x86/rockchip/sunxi/bcm27xx…）

# 每周日 10:00（北京时间）自动编译 = UTC 周日 02:00
# MTK 与 IPQ 由各自 workflow 负责，这里排除 mediatek / qualcommax / qualcommbe / ipq806x / ipq40xx
on:
  schedule:
    # 每周二、周六 北京时间 11:00 = UTC 03:00
    - cron: '0 3 * * 2,6'
  workflow_dispatch:
    inputs:
      groups:
        description: '1、平台过滤（逗号分隔，空=curated 白名单）：可写 ramips/mt7621、ramips、ath79/generic、all'
        required: false
        default: ''
      mode:
        description: '2、机型范围（curated=常用平台白名单；all=除 MTK/IPQ 外全部平台；custom=只编 devices 里的）'
        required: false
        default: 'curated'
        type: choice
        options:
          - 'curated'
          - 'all'
          - 'custom'
      devices:
        description: '3、自定义机型（mode=custom 时生效，空格/逗号分隔）'
        required: false
        default: ''
      exclude:
        description: '4、排除机型（空格分隔）'
        required: false
        default: ''
      chunk:
        description: '5、每片机型上限（0=不切片）'
        required: false
        default: '60'
      packages:
        description: '6、额外固件包（空格分隔，默认已含 luci）'
        required: false
        default: 'luci'
      make_release:
        description: '7、是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: xwrt-others-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SRC_REF: master

jobs:
  # ============================================================
  # Job 1：解析机型清单（排除已由 MTK / IPQ workflow 覆盖的平台）
  # ============================================================
  prepare:
    name: 🧭 解析其他平台机型
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      src_sha: ${{ steps.srcver.outputs.sha }}
    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ env.SRC_REF }}

      - name: 记录源码版本
        id: srcver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 生成目标元数据（机型符号的权威来源）
        run: |
          set -o pipefail
          if ! make -j1 prepare-tmpinfo > prepare-tmpinfo.log 2>&1; then
            echo "::warning::prepare-tmpinfo 失败，将回退到静态解析 image/*.mk"
            tail -30 prepare-tmpinfo.log || true
          fi
          if [ -f tmp/.config-target.in ]; then
            echo "✔ tmp/.config-target.in 已生成：$(wc -l < tmp/.config-target.in) 行"
            echo "机型符号数: $(grep -c 'menuconfig TARGET_DEVICE_' tmp/.config-target.in || true)"
          else
            echo "::warning::tmp/.config-target.in 不存在，改用静态解析"
          fi

      - name: 解析并生成编译矩阵
        id: plan
        env:
          GROUPS: ${{ inputs.groups || '' }}
          MODE: ${{ inputs.mode || 'curated' }}
          CUSTOM: ${{ inputs.devices || '' }}
          EXCLUDE: ${{ inputs.exclude || '' }}
          CHUNK: ${{ inputs.chunk || '60' }}
        run: |
          cat > /tmp/plan.py <<'PY'
          import os, re, json, glob, sys

          # 已有专门 workflow 覆盖 / 按要求排除的平台
          EXCLUDED_TARGETS = {"mediatek", "qualcommax", "qualcommbe", "ipq806x", "ipq40xx"}
          # 明确不再编译的子目标（target_subtarget）：x86-geode 按需求移除
          EXCLUDED_SUBTARGETS = {"x86_geode"}

          # curated：常用平台白名单（target/subtarget），其余平台需显式 groups=all
          CURATED = {
              "x86/64", "x86/generic",
              "ramips/mt7621", "ramips/mt7620", "ramips/mt76x8",
              "ath79/generic",
              "rockchip/armv8",
              "sunxi/cortexa53",
              "bcm27xx/bcm2711",
              "realtek/rtl838x",
          }

          groups_sel = [g.strip().lower().replace("-", "/") for g in
                        os.environ.get("GROUPS", "").replace(";", ",").split(",") if g.strip()]
          exclude = set(x for x in re.split(r"[\s,]+", os.environ.get("EXCLUDE", "").strip()) if x)
          mode = (os.environ.get("MODE", "curated") or "curated").strip()
          chunk = int((os.environ.get("CHUNK", "60") or "60").strip() or 60)
          custom = [x for x in re.split(r"[\s,]+", os.environ.get("CUSTOM", "").strip()) if x]

          def parse_mk(path):
              txt = open(path, encoding="utf-8", errors="replace").read()
              regs = {}
              for line in txt.splitlines():
                  if "TARGET_DEVICES" in line and "+=" in line:
                      for tok in re.split(r"[\s\\]+", line.split("+=", 1)[1]):
                          tok = tok.strip()
                          if tok and re.fullmatch(r"[A-Za-z0-9_.\-]+", tok):
                              regs[tok] = True
              return regs

          def subtargets_of(target):
              out = []
              p = "target/linux/%s/Makefile" % target
              if os.path.exists(p):
                  body = open(p, encoding="utf-8", errors="replace").read()
                  for line in body.splitlines():
                      mm = re.match(r"\s*SUBTARGETS\s*[:+]?=\s*(.*)", line)
                      if mm:
                          out += [x for x in re.split(r"[\s\\]+", mm.group(1))
                                  if x and re.fullmatch(r"[A-Za-z0-9_.\-]+", x)]
              return out

          def symbols_from_meta():
              out = []
              meta = "tmp/.config-target.in"
              if not os.path.exists(meta):
                  return out
              txt = open(meta, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"^\s*menuconfig\s+TARGET_DEVICE_(\S+)\s*$", txt, re.M):
                  sym = m.group(1)
                  if "_DEVICE_" not in sym:
                      continue
                  conf, dev = sym.rsplit("_DEVICE_", 1)
                  out.append((conf, dev))
              return out

          def symbols_static():
              out = []
              for tdir in sorted(glob.glob("target/linux/*/")):
                  t = os.path.basename(tdir.rstrip("/\\"))
                  if t in EXCLUDED_TARGETS:
                      continue
                  subs = subtargets_of(t)
                  if subs:
                      files = ["target/linux/%s/image/%s.mk" % (t, s) for s in subs]
                  else:
                      files = glob.glob("target/linux/%s/image/*.mk" % t)
                  for p in files:
                      if not os.path.exists(p):
                          continue
                      sub = os.path.splitext(os.path.basename(p))[0]
                      for dev in parse_mk(p):
                          out.append(("%s_%s" % (t, sub), dev))
              return out

          pairs = symbols_from_meta()
          if not pairs:
              print("::warning::元数据不可用，改用静态解析 image/*.mk 枚举机型")
              pairs = symbols_static()

          # 排除平台与明确移除的子目标
          pairs = [(c, d) for c, d in pairs
                   if c.split("_", 1)[0] not in EXCLUDED_TARGETS and c not in EXCLUDED_SUBTARGETS]
          print("符号表机型总数（其他平台）: %d" % len(pairs))

          def tsub(conf):
              t, _, s = conf.partition("_")
              return t, (s or "generic")

          known = {dev for _, dev in pairs}
          if mode == "custom":
              want_custom = set(d for d in custom if d in known)
              lost = [d for d in custom if d not in known]
              if lost:
                  print("::warning::这些自定义机型在本源码树不存在（或属于 MTK/IPQ 专属 workflow），已忽略: %s"
                        % " ".join(sorted(set(lost))))
              pairs = [(c, d) for c, d in pairs if d in want_custom]
          elif mode == "curated" and not groups_sel:
              pairs = [(c, d) for c, d in pairs if "%s/%s" % tsub(c) in CURATED]
              print("curated 白名单匹配机型: %d 台" % len(pairs))

          buckets = {}
          for conf, dev in pairs:
              if dev in exclude:
                  continue
              buckets.setdefault(conf, []).append(dev)

          # 平台过滤：支持 target/subtarget、target、all
          order = sorted(buckets)
          if groups_sel:
              allow_all = any(g in ("all", "*") for g in groups_sel)
              if not allow_all:
                  def keep(conf):
                      t, s = tsub(conf)
                      full = "%s/%s" % (t, s)
                      return any(g == full or g == t for g in groups_sel)
                  before = len(order)
                  order = [c for c in order if keep(c)]
                  print("平台过滤后 %d/%d 个子目标" % (len(order), before))
                  if not order:
                      print("::error::groups 过滤后没有任何子目标，检查参数（如 ramips/mt7621 或 ramips）")
                      sys.exit(1)

          os.makedirs("plan", exist_ok=True)
          matrix, rows, total = [], [], 0
          for conf in order:
              devs = sorted(buckets[conf])
              if not devs:
                  continue
              t, s = tsub(conf)
              label_base = "%s-%s" % (t, s)
              pieces = [devs] if chunk <= 0 else [devs[i:i + chunk] for i in range(0, len(devs), chunk)]
              for idx, piece in enumerate(pieces, 1):
                  label = label_base if len(pieces) == 1 else "%s (%d/%d)" % (label_base, idx, len(pieces))
                  fname = "%s-%d.txt" % (label_base, idx)
                  with open(os.path.join("plan", fname), "w") as f:
                      f.write("\n".join(piece) + "\n")
                  matrix.append({
                      "group": label_base,
                      "label": label,
                      "target": t,
                      "sub": s,
                      "conf": conf,
                      "file": fname,
                      "count": len(piece),
                  })
                  total += len(piece)
                  rows.append((label, conf, len(piece), piece))

          if not matrix:
              print("::error::没有解析到任何机型，检查 groups/mode/exclude 参数")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps(matrix, separators=(",", ":")))  # include: 需要纯数组
              f.write("total=%d\n" % total)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧭 其他平台机型清单（模式: %s）\n\n" % mode)
              f.write("| 平台 | 子目标 | 台数 | 机型 |\n|---|---|---|---|\n")
              for label, conf, n, devs in rows:
                  show = "<br>".join(devs[:10]) + ("<br>…" if len(devs) > 10 else "")
                  f.write("| %s | %s | %d | %s |\n" % (label, conf, n, show))
              f.write("\n合计 **%d** 台机型，%d 个并行编译 job\n" % (total, len(matrix)))
              f.write("\n> MTK / IPQ 平台请用对应 workflow；IPQ40xx 按要求不编译。\n")
          print("合计 %d 台，%d 个 job" % (total, len(matrix)))
          for m in matrix:
              print("  - %-24s %4d 台  %s" % (m["label"], m["count"], m["file"]))
          PY
          python3 /tmp/plan.py

      - name: 上传清单
        uses: actions/upload-artifact@v4
        with:
          name: device-plan-others
          path: plan/
          retention-days: 3

  # ============================================================
  # Job 2：矩阵编译
  # ============================================================
  build:
    name: 🏗️ ${{ matrix.label }} (${{ matrix.count }} 台)
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ env.SRC_REF }}

      - name: 释放磁盘空间（腾出更多编译容量）
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd /usr/local/share/chromium \
                      /opt/microsoft /usr/share/sbt 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1
          avail=$(df -m / | awk 'NR==2 {print $4}')
          echo "可用空间: ${avail} MB"
          if [ "${avail:-0}" -lt 20000 ]; then
            echo "::warning::可用空间不足 20GB，大机型批量编译可能中途写满磁盘"
          fi

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 下载机型清单
        uses: actions/download-artifact@v4
        with:
          name: device-plan-others
          path: plan

      - name: 恢复 ccache（加速二次编译）
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-xwrt-others-${{ matrix.conf }}-${{ matrix.file }}-${{ github.sha }}
          restore-keys: |
            ccache-xwrt-others-${{ matrix.conf }}-${{ matrix.file }}-
            ccache-xwrt-others-${{ matrix.conf }}-
            ccache-xwrt-others-
            ccache-

      - name: ccache 预热配置
        run: |
          ccache --version | head -1
          ccache -M 6G
          ccache -z
          echo "CCACHE_DIR=$PWD/.ccache"

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config（多机型 + 自动规避 Kconfig 递归依赖）
        env:
          CONF: ${{ matrix.conf }}
          TARGET: ${{ matrix.target }}
          DEVICE_FILE: plan/${{ matrix.file }}
          PACKAGES: ${{ inputs.packages || 'luci' }}
          PROTECTED: luci luci-base luci-compat base-files busybox
        run: |
          cat > gen_config.py <<'PY'
          import os, re, sys, time

          conf = os.environ["CONF"]
          target = os.environ["TARGET"]
          want = [l.strip() for l in open(os.environ["DEVICE_FILE"]) if l.strip()]
          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]

          lines = [
              "CONFIG_TARGET_%s=y" % target,
              "CONFIG_TARGET_%s=y" % conf,
              "CONFIG_TARGET_MULTI_PROFILE=y",
              "# CONFIG_TARGET_ALL_PROFILES is not set",
              "CONFIG_TARGET_PER_DEVICE_ROOTFS=y",
              "CONFIG_DEVEL=y",
              "CONFIG_CCACHE=y",
          ]
          lines += ["CONFIG_TARGET_DEVICE_%s_DEVICE_%s=y" % (conf, d) for d in want]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]

          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.txt", "w").write("\n".join(want) + "\n")
          print("已写入 %d 台机型 + %d 个额外包（%s）" % (len(want), len(pkgs), conf))
          PY

          cat > verify_config.py <<'PY'
          import os, re, sys

          conf = os.environ["CONF"]
          want = [l.strip() for l in open("wanted.txt") if l.strip()]
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          pref = "CONFIG_TARGET_DEVICE_%s_DEVICE_" % conf
          got = set(re.findall(r"^" + re.escape(pref) + r"(\S+)=y$", cfg, re.M))
          lost = [w for w in want if w not in got]
          print("预期 %d 台，实际选中 %d 台" % (len(want), len(got)))
          if lost:
              head = " ".join(lost[:15]) + (" ..." if len(lost) > 15 else "")
              print("::warning::被 kconfig 丢弃 %d 台: %s" % (len(lost), head))
          if not got:
              mp = [l.strip() for l in cfg.splitlines() if "MULTI_PROFILE" in l]
              print("::error::一台机型都没选中，MULTI_PROFILE 状态: %s" % (mp or "（.config 里没有该符号）"))
              sys.exit(1)
          for p in ("luci",):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          PY

          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi

            python3 gen_config.py

            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            vrc=0
            python3 verify_config.py || vrc=$?
            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包，不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            echo "::error::.config 校验未通过，且 defconfig 没有递归依赖报错"
            echo "===== .config 前 25 行 =====" && head -25 .config || true
            echo "===== defconfig.log 尾部 =====" && tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done
          [ "$ok" = "1" ] || { echo "::error::3 次尝试后仍未得到有效 .config"; exit 1; }

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          echo "并发数: $(nproc)"
          df -h / | tail -1
          rc=0
          make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败（静默模式下失败包的报错被吞），用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              echo "未提取到失败包名，对全树 -j1 V=s 复现（到失败点即停）"
              make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  target/linux)
                    # target/linux 失败可能是 compile，也可能是 install（镜像生成）阶段；
                    # compile 已重跑过成功时，只有全树 V=s 才能走到 install 失败点拿到真实错误
                    echo "===== V=s 复现 target/linux（全树跑到失败点） ====="
                    make -j1 V=s 2>&1 | tee -a error.log || true ;;
                  *)
                    echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: ccache 命中统计
        if: always()
        run: |
          ccache -s || true
          df -h / | tail -1

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-others-${{ matrix.conf }}-${{ strategy.job-index }}
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验并收集产物
        env:
          SUB: ${{ matrix.sub }}
          TGT: ${{ matrix.target }}
        run: |
          mkdir -p out
          DIR="bin/targets/$TGT/$SUB"
          echo "产物目录: $DIR"
          ls -la "$DIR" 2>/dev/null | head -20 || true
          find "$DIR" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.ubi' \
               -o -name '*.trx' -o -name '*.tar.gz' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          miss=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if ls out/ 2>/dev/null | grep -qF -- "$d"; then
              echo "  ✔ $d"
            else
              echo "::warning::$d 已选中但没找到产物（可能只出 initramfs 或该机型打包被跳过）"
              miss=$((miss+1))
            fi
          done < wanted.txt
          n=$(ls out 2>/dev/null | wc -l)
          echo "产物文件数: $n，缺失机型: $miss"
          if [ "$n" -eq 0 ]; then
            echo "::error::没有收集到任何产物"
            exit 1
          fi

          {
            echo "## 🏗️ ${{ matrix.label }} 编译完成"
            echo ""
            echo "- target/子目标: \`${{ matrix.conf }}\`"
            echo "- 机型: ${{ matrix.count }} 台，产物文件: $n 个，缺失: $miss 台"
            echo ""
            echo "| 机型 | 产物 |"
            echo "|---|---|"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              f=$(ls out 2>/dev/null | grep -F -- "$d" | head -6 | tr '\n' '<br>')
              echo "| $d | ${f:-—} |"
            done < wanted.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-others-${{ matrix.conf }}-${{ strategy.job-index }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布 Release
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: images-others-*
          path: rel
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh | head -30
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "文件总数: $(ls -1 | wc -l)"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="xwrt-others-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          X-Wrt 自动编译 · 其他平台（源码：本仓库 ${{ env.SRC_REF }}）

          - 触发方式: ${{ github.event_name }}
          - 提交: ${{ needs.prepare.outputs.src_sha }}
          - 机型数: ${{ needs.prepare.outputs.total }} 台
          - 覆盖平台: ramips / ath79 / x86 / rockchip / sunxi / bcm27xx / realtek 等
          - 不含: mediatek（见 MTK workflow）、qualcommax/qualcommbe/ipq806x（见 IPQ workflow）、IPQ40xx（按要求排除）
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          不同平台的镜像格式不同（.bin / .itb / .img.gz / .tar.gz），刷机方式请参照对应平台说明。
          EOF
          gh release create "$TAG" rel/* \
            --title "X-Wrt 其他平台 · $TAG" \
            --notes-file notes.md \
            --latest
