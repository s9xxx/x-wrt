name: 🛠️ X-Wrt MT798x (filogic) Build-cudy_tr3000-512mb-v1

# 每周三早上 09:00（北京时间）自动编译 = UTC 周三 01:00
on:
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（filogic.mk 里 TARGET_DEVICES 名称）'
        required: false
        default: 'cudy_tr3000-512mb-v1'
      src_ref:
        description: '本仓库源码分支/提交'
        required: false
        default: 'master'
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: xwrt-mt798x-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVICE: ${{ inputs.device || 'cudy_tr3000-512mb-v1' }}
  SRC_REF: ${{ inputs.src_ref || 'master' }}

jobs:
  # ============================================================
  # Job 1：编译（源码 = 本仓库 x-wrt master，内核 6.18）
  # ============================================================
  build:
    name: 🏗️ X-Wrt MT798x
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ env.SRC_REF }}

      - name: 机型锚点自检
        run: |
          grep -q 'DEVICE_DTS := mt7981b-cudy-tr3000-512mb-v1' target/linux/mediatek/image/filogic.mk \
            || { echo "::error::filogic.mk 中没有 cudy_tr3000-512mb-v1 Device 定义"; exit 1; }
          grep -q 'TARGET_DEVICES += cudy_tr3000-512mb-v1' target/linux/mediatek/image/filogic.mk \
            || { echo "::error::filogic.mk 中没有 cudy_tr3000-512mb-v1 注册"; exit 1; }
          grep -q '0x1FA40000' target/linux/mediatek/dts/mt7981b-cudy-tr3000-512mb-v1.dts \
            || { echo "::error::512MB dts 不完整"; exit 1; }
          echo "✔ TR3000 512MB 机型定义已就位"
          git log --oneline -1

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-xwrt-mt798x-${{ github.sha }}
          restore-keys: |
            ccache-xwrt-mt798x-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config（目标机型 + 带自校验重试）
        run: |
          # 基底：目标平台 + 机型 + LuCI；defconfig 会补齐其余默认值
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y
          CONFIG_PACKAGE_luci=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"
            make -j1 defconfig > defconfig.log 2>&1 || { tail -30 defconfig.log; exit 1; }

            got=$(grep -cE "^CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y$" .config || true)
            if [ "$got" = "1" ]; then
              ok=1
              echo "✔ 机型 $DEVICE 已选中"
              echo "::endgroup::"
              break
            fi

            # defconfig 多开的机型显式关闭后重试
            extra=$(grep -E "^CONFIG_TARGET_mediatek_filogic_DEVICE_\S+=y$" .config \
                    | grep -v "${DEVICE}" | sed -E 's/^(CONFIG\S+)=y$/# \1 is not set/')
            if [ -n "$extra" ]; then
              echo "显式关闭 defconfig 多开的机型："
              echo "$extra"
              printf '%s\n' "$extra" >> .config
              echo "::endgroup::"
              continue
            fi
            echo "::error::机型 $DEVICE 被 kconfig 丢弃且无多开机型"
            grep -i "device" .config | head -10
            tail -30 defconfig.log
            echo "::endgroup::"
            exit 1
          done
          [ "$ok" = "1" ] || { echo "::error::3 次尝试后仍未得到有效 .config"; exit 1; }

          # 关键包抽查（DEVICE_PACKAGES 必须被选中，否则固件缺 wifi/固件驱动）
          for p in kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware kmod-usb3; do
            if grep -qE "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "OK   CONFIG_PACKAGE_${p}=y"
            elif grep -qE "^CONFIG_PACKAGE_${p}=m$" .config; then
              echo "OK(m) CONFIG_PACKAGE_${p}=m"
            else
              echo "::error::关键包 ${p} 未被选中"
              grep -E "${p}" .config | head -5
              exit 1
            fi
          done

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          nproc
          # GitHub Actions 默认以 bash -e 运行，裸管道失败会立刻退出，
          # 必须用 || rc=... 兜住，否则下面的 V=s 诊断逻辑永远执行不到
          rc=0
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败（静默模式下失败包的报错被吞），用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              echo "未提取到失败包名，对全树 -j1 V=s 复现（到失败点即停）"
              make -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  target/linux|package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *)
                    echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: 失败诊断
        if: failure()
        run: |
          for f in defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mt798x
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验并收集产物
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*sysupgrade.bin' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          if ls out/ 2>/dev/null | grep -qF -- "$DEVICE"; then
            echo "✔ $DEVICE sysupgrade 产物已生成"
          else
            echo "::error::$DEVICE 没有找到产物"
            ls -la out/ bin/targets/mediatek/filogic/ 2>/dev/null || true
            exit 1
          fi
          echo "产物文件数: $(ls out | wc -l)"
          {
            echo "## 🏗️ X-Wrt MT798x 编译完成"
            echo ""
            echo "- 机型: \`$DEVICE\`（源码: 本仓库 master / 内核 6.18）"
            echo "- 产物文件: $(ls out | wc -l) 个"
            echo ""
            echo "| 文件 |"
            echo "|---|"
            ls out | while read -r f; do echo "| $f |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-mt798x
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 2：发布到 Release（只新增，绝不删除/覆盖历史 release）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-mt798x
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true

      - name: 创建 Release（xwrt-mt798x-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEVICE: ${{ inputs.device || 'cudy_tr3000-512mb-v1' }}
          SRC_REF: ${{ inputs.src_ref || 'master' }}
        run: |
          TAG="xwrt-mt798x-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          X-Wrt 自动编译（MT798x filogic，内核 6.18）

          - 触发方式: ${{ github.event_name }}
          - 机型: ${DEVICE}
          - 源码: 本仓库 master
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          TR3000 512MB 为硬改 512MB Flash 专用（ubi 分区 0x1FA40000）。
          128MB 原版请刷官方 cudy_tr3000-v1 固件，刷错会变砖。
          EOF
          gh release create "$TAG" rel/* \
            --title "X-Wrt MT798x · ${DEVICE} · $TAG" \
            --notes-file notes.md \
            --latest
